<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Smart Campus – Room Availability Checker</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --muted:#5d6678; --ok:#147a3d; --bad:#b3261e; --warn:#9a6700; --accent:#2f5bd3; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
    header { background:var(--ink); color:#fff; padding:16px 20px; }
    header h1 { margin:0; font-size:1.25rem; }
    header p { margin:4px 0 0; color:#c8cfdc; font-size:.9rem; }
    main { max-width:1000px; margin:0 auto; padding:20px; display:flex; flex-wrap:wrap; gap:20px; }
    .card { background:var(--card); border-radius:10px; padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.08); flex:1 1 300px; min-width:0; }
    .wide { flex-basis:100%; }
    h2 { font-size:1.05rem; margin:0 0 12px; }
    label { display:block; font-weight:600; margin:12px 0 4px; font-size:.9rem; }
    input[type=datetime-local], input[type=number] { width:100%; padding:10px; border:1px solid #c9ced8; border-radius:6px; font-size:1rem; }
    .row { display:flex; align-items:center; gap:8px; margin-top:12px; }
    button { margin-top:16px; padding:10px 18px; border:0; border-radius:6px; background:var(--accent); color:#fff; font-size:1rem; cursor:pointer; }
    .hint { color:var(--muted); font-size:.82rem; margin-top:4px; }
    .result { margin-top:16px; padding:12px; border-radius:8px; border-left:5px solid #ccc; background:#fafafa; }
    .result.ok { border-color:var(--ok); } .result.ok strong { color:var(--ok); }
    .result.bad { border-color:var(--bad); } .result.bad strong { color:var(--bad); }
    .result.warn { border-color:var(--warn); } .result.warn strong { color:var(--warn); }
    .result p { margin:6px 0; } .result code { font-size:.8rem; color:var(--muted); }
    ul { padding-left:18px; margin:0; } li { margin:6px 0; font-size:.9rem; }
    .table-wrap { overflow-x:auto; }
    table { border-collapse:collapse; width:100%; font-size:.85rem; }
    th, td { border:1px solid #e1e4ea; padding:6px 8px; text-align:left; vertical-align:top; }
    th { background:#eef1f6; }
    td.pass { color:var(--ok); font-weight:700; } td.fail { color:var(--bad); font-weight:700; }
    #tests-summary { font-weight:600; margin-top:10px; }
    @media (max-width: 600px) { main { padding:12px; gap:12px; } header h1 { font-size:1.05rem; } }
  </style>
</head>
<body>
  <header>
    <h1>Smart Campus — Room B-204 Availability Checker</h1>
    <p>Code-based solution · Practice #12 · fictional data only</p>
  </header>
  <main>
    <section class="card">
      <h2>Check availability</h2>
      <form id="form" novalidate>
        <label for="start">Start time</label>
        <input id="start" type="datetime-local" />
        <label for="duration">Duration (minutes)</label>
        <input id="duration" type="number" step="1" placeholder="1 – 120" />
        <div class="hint">Must be &gt; 0 and ≤ <span id="max"></span> minutes.</div>
        <div class="row"><input id="blocked" type="checkbox" /><label for="blocked" style="margin:0">Room is blocked</label></div>
        <button type="submit">Check</button>
      </form>
      <div id="result" class="result" aria-live="polite"><p>Select a future start time and duration.</p></div>
    </section>

    <section class="card">
      <h2>Existing bookings (read-only)</h2>
      <ul id="bookings"></ul>
    </section>

    <section class="card wide">
      <h2>Acceptance tests T1–T8</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Case</th><th>Input</th><th>Expected</th><th>Observed</th><th>Result</th></tr></thead>
          <tbody id="tests-body"></tbody>
        </table>
      </div>
      <button id="run-tests" type="button">Run tests</button>
      <div id="tests-summary"></div>
    </section>
  </main>
  <script src="availability.js"></script>
  <script src="test-cases.js"></script>
  <script src="app.js"></script>
</body>
</html>
